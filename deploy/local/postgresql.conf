# Replaces the image's default config entirely, so listen_addresses must be set.
listen_addresses = '*'

# DB Version: 18
# OS Type: linux
# DB Type: mixed
# Total Memory (RAM): 8 GB
# Data Storage: ssd
max_connections = 100
shared_buffers = 2GB
effective_cache_size = 6GB
maintenance_work_mem = 512MB
checkpoint_completion_target = 0.9
wal_buffers = 16MB
default_statistics_target = 100
random_page_cost = 1.1
effective_io_concurrency = 200
work_mem = 8738kB
huge_pages = try
jit = off
wal_compression = lz4
io_method = io_uring
min_wal_size = 1GB
max_wal_size = 4GB
