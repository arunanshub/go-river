; Local pgbouncer, mounted over the image's generated config. userlist.txt is
; still written by the image's entrypoint from DB_USER/DB_PASSWORD.
[databases]
winderclub = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction

; Server connections are the scarce side. Budget, against postgresql.conf:
;   pgbouncer processes × (default_pool_size + reserve_pool_size)
;   + direct connections (migrations, psql, pg-view, DB tests)
;   < max_connections (100) − superuser_reserved_connections (3)
; Overrunning it fails requests with "sorry, too many clients already".
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 1

; Client connections are cheap (no backend each), so the app's pool_max_conns
; can exceed default_pool_size; extra clients queue here, not in postgres.
max_client_conn = 1000
